behaviors:
  DroneDelivery:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
   
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 100000
    keep_checkpoints: 10